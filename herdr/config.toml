# herdr -- terminal workspace manager for AI coding agents.
# Symlinked to ~/.config/herdr/config.toml (see `symlinks`).
# Reload in a running server without restarting: `hrdrrc`.
# Full annotated template of every option: `herdr --default-config`.

onboarding = false

[keys]
# Same prefix as tmux, so the muscle memory carries over unchanged.
# This also frees Ctrl+b: a tmux deliberately nested inside a herdr pane
# still answers on its own backup prefix (tmux.conf `prefix2 C-b`).
prefix = "ctrl+space"

# Matches tmux's `|` for vertical split. Punctuation bindings are
# terminal-dependent, so if this stops registering on the PT-PT layout
# (see the `[` note in tmux.conf), fall back to "prefix+v".
split_vertical = "prefix+|"

[theme]
# gruvbox is the closest built-in to Everforest, then overridden below to
# match Ghostty, tmux and Neovim. Palette source: tmux/tmux.conf @thm_* vars.
name = "gruvbox"
auto_switch = false

[theme.custom]
sidebar_bg = "#1e2326"      # @thm_bg / crust
panel_bg = "reset"          # inherit Ghostty's own background
active_row_bg = "#2e383c"   # @thm_surface_1
selection_bg = "#374145"    # @thm_surface_2
accent = "#a7c080"          # @thm_green -- Everforest's signature
red = "#e67e80"             # @thm_red
green = "#a7c080"           # @thm_green

[ui]
status_indicators = "symbols"

[ui.toast]
# Hand notifications to Ghostty as real desktop notifications.
# Replaces the old terminal-notifier Stop hook in ~/.claude/settings.json.
delivery = "terminal"

[session]
# Resume agent panes into their native conversation sessions after a server
# restart -- the agent-aware counterpart to tmux-resurrect.
resume_agents_on_restore = true

[experimental]
# Keep pane scrollback across full server restarts.
# Closest equivalent to @resurrect-capture-pane-contents, which this setup drops.
pane_history = true

[advanced]
# Per-pane scrollback cap, in bytes. There is no "unlimited" value -- herdr
# mirrors Ghostty's scrollback-limit, where 0 means *no* scrollback rather
# than infinite. 256 MiB is ~3M lines of agent output per pane: effectively
# infinite for a working day, while still bounding worst-case memory.
# Raise it further if a long-running pane ever truncates; it is RAM per pane,
# so the real ceiling is this value times the number of open panes.
scrollback_limit_bytes = 268435456
